name: SN Daily Place Rank Update

on:
  schedule:
    # 매일 오전 10시(KST) = UTC 01:00 — 점심·피크 시간 회피
    - cron: '0 1 * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml

      - name: Run search update
        run: python scripts/update_search_results.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/search_results.csv
          git commit -m "순위 자동 업데이트: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
